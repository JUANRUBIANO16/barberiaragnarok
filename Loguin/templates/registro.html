{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ragnarok Barber - Registro</title>

    <link rel="stylesheet" href="{% static 'css/logins.css' %}">

    <style>
        .messages-container {
            margin-bottom: 15px;
        }

        .custom-alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 10px;
            animation: fadeIn 0.4s ease;
            font-weight: 500;
            border-left: 4px solid;
        }

        .custom-alert.success {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border-color: #10b981;
        }

        .custom-alert.error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border-color: #ef4444;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-form .form-group {
            margin-bottom: 15px;
        }

    </style>
</head>

<body>

<div class="login-container">
    <div class="login-card">

        <div class="login-header">

            <div class="logo">
                <img src="{% static 'img/jj2.png' %}" width="40">
            </div>

            <h1>Ragnarok Barber</h1>
            <p>Crear cuenta de cliente</p>

        </div>

        <!-- MENSAJES -->
        {% if messages %}
        <div class="messages-container">
            {% for message in messages %}
                <div class="custom-alert {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
        {% endif %}

        <!-- FORM -->
        <form method="POST" action="{% url 'registro' %}" class="login-form">
            {% csrf_token %}

            <div class="form-group">
                <label>Nombre</label>
                <input type="text" name="nombre" required>
            </div>

            <div class="form-group">
                <label>Apellido</label>
                <input type="text" name="apellido" required>
            </div>

            <div class="form-group">
                <label>Correo</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" required>
            </div>

            <div class="form-group">
                <label>Confirmar contraseña</label>
                <input type="password" name="confirm" required>
            </div>

            <button type="submit" class="login-btn">
                Registrarse
            </button>

            <div style="text-align:center; margin-top:15px;">
                <p style="font-size:13px; color:#ccc;">
                    ¿Ya tienes cuenta?
                    <a href="{% url 'loguin' %}" style="color:#4da3ff; text-decoration:none;">
                        Inicia sesión
                    </a>
                </p>
            </div>

        </form>

    </div>
</div>

</body>
</html>
