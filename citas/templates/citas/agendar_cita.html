{% extends 'base.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto|Varela+Round">
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="{% static 'css/table.css' %}">

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

<script>
$(document).ready(function(){

    function formato12h(hora24){
        let [h,m] = hora24.split(":");
        h = parseInt(h);

        let sufijo = h >= 12 ? "PM" : "AM";
        h = h % 12;
        h = h ? h : 12;

        return `${h}:${m} ${sufijo}`;
    }

    function cargarHoras(){

        let barbero = $("#barbero").val();
        let fecha = $("#fecha").val();

        if(barbero && fecha){

            fetch(`/citas/obtener-horas/?barbero=${barbero}&fecha=${fecha}`)
            .then(res => res.json())
            .then(data => {

                let select = $("#hora");
                select.html('');

                if(data.horas.length > 0){

                    data.horas.forEach(h => {

                        select.append(
                            `<option value="${h}">
                                ${formato12h(h)}
                            </option>`
                        );

                    });

                }else{

                    select.append(
                        `<option value="">
                            Sin disponibilidad
                        </option>`
                    );

                }

            });

        }

    }

    $("#barbero").change(cargarHoras);
    $("#fecha").change(cargarHoras);

});
</script>

<div class="container-xl">

{% if messages %}
<div class="mt-3">
    {% for message in messages %}
        <div class="alert
        {% if message.tags == 'error' %}alert-danger
        {% elif message.tags == 'success' %}alert-success
        {% else %}alert-info
        {% endif %}
        alert-dismissible fade show">

            {{ message }}

            <button type="button" class="close" data-dismiss="alert">
                <span>&times;</span>
            </button>

        </div>
    {% endfor %}
</div>
{% endif %}

<div class="table-responsive">
<div class="table-wrapper">

<div class="table-title">
<div class="row">

<div class="col-sm-6">
<h2>Agendar <b>Cita</b></h2>
</div>

</div>
</div>

<form method="POST" action="{% url 'crear_Cita' %}">
{% csrf_token %}

<div class="row">

<div class="col-md-6">

    <div class="form-group">
        <label>Fecha</label>
        <input type="date"
               id="fecha"
               name="fecha"
               class="form-control"
               required>
    </div>

</div>

<div class="col-md-6">

    <div class="form-group">
        <label>Barbero</label>

        <select id="barbero"
                name="barbero"
                class="form-control"
                required>

            <option value="">Seleccione</option>

            {% for b in barberos %}
            <option value="{{ b.id }}">
                {{ b.nombre }}
            </option>
            {% endfor %}

        </select>

    </div>

</div>

</div>

<div class="row">

<div class="col-md-6">

    <div class="form-group">
        <label>Hora</label>

        <select id="hora"
                name="hora"
                class="form-control"
                required>

            <option value="">
                Seleccione fecha y barbero
            </option>

        </select>

    </div>

</div>

<div class="col-md-6">

    <div class="form-group">
        <label>Servicio</label>

        <select name="servicio"
                class="form-control"
                required>

            {% for s in servicios %}
            <option value="{{ s.id }}">
                {{ s.nombre }}
            </option>
            {% endfor %}

        </select>

    </div>

</div>

</div>

<div class="text-right">

    <button type="submit"
            class="btn btn-success">

        <i class="material-icons">
            event_available
        </i>

        Agendar Cita

    </button>

</div>

</form>

</div>
</div>

</div>

{% endblock %}
